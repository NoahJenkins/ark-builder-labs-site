name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress workflows on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict GITHUB_TOKEN permissions to least privilege
permissions:
  contents: read

jobs:
  # GitHub expression string comparisons ignore case; Bash enforces exact opt-in.
  runner-routing:
    name: Select CI Runner
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.runner.outputs.label }}
    steps:
      - name: Select runner for this event
        id: runner
        env:
          OPTIPLEX_CI_ENABLED: ${{ vars.OPTIPLEX_CI_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          label=ubuntu-latest
          if [[ "$OPTIPLEX_CI_ENABLED" == "true" ]] &&
             { [[ "$EVENT_NAME" != "pull_request" ]] ||
               [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; }; then
            label=optiplex-ci-ubuntu24
          fi
          printf 'label=%s\n' "$label" >> "$GITHUB_OUTPUT"

  # Fast checks run first - type checking and linting
  typecheck:
    name: TypeScript & Lint
    needs: runner-routing
    runs-on: ${{ needs.runner-routing.outputs.label }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Run TypeScript type checking
        run: pnpm exec tsc --noEmit
        
      - name: Run ESLint
        run: pnpm lint

      - name: Verify dependency automation policy
        run: pnpm run test:workflow-policy

  jest-tests:
    name: Jest Tests
    runs-on: ${{ needs.runner-routing.outputs.label }}
    needs: [runner-routing, typecheck]  # Only run if typecheck passes
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Run Jest tests
        run: pnpm test
        
      - name: Upload Jest coverage reports
        uses: codecov/codecov-action@v7
        if: always() && hashFiles('coverage/lcov.info') != ''
        with:
          files: ./coverage/lcov.info
          flags: jest
          name: jest-coverage
          fail_ci_if_error: false
        continue-on-error: true

  # Build verification - depends on typecheck
  build:
    name: Build Check
    runs-on: ${{ needs.runner-routing.outputs.label }}
    needs: [runner-routing, typecheck]  # Only build if types are valid
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
            
      - name: Setup Next.js cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Build application
        run: pnpm run build

  playwright-tests:
    name: Playwright Tests
    runs-on: ${{ needs.runner-routing.outputs.label }}
    needs: [runner-routing, typecheck]  # Run in parallel with build to reduce wall-clock CI time
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
            
      - name: Get Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p 'require("./package.json").devDependencies["@playwright/test"] || require("./package.json").dependencies["@playwright/test"]')
          echo "PLAYWRIGHT_VERSION=$PLAYWRIGHT_VERSION" >> $GITHUB_OUTPUT
        
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.PLAYWRIGHT_VERSION }}
          restore-keys: |
            ${{ runner.os }}-playwright-
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps
        
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps
        
      - name: Run Playwright tests
        run: pnpm run test:e2e
        
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
