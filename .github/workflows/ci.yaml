name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress workflows on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict GITHUB_TOKEN permissions to least privilege
permissions:
  contents: read

jobs:
  # All jobs run in parallel; branch protection gates the merge on each name.
  typecheck:
    name: TypeScript & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Install pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.0

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Run TypeScript type checking
        run: pnpm exec tsc --noEmit
        
      - name: Run ESLint
        run: pnpm lint

  jest-tests:
    name: Jest Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Install pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.0

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
          
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Run Jest tests
        run: pnpm test

  # Build verification
  build:
    name: Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Install pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.0

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
            
      - name: Setup Next.js cache
        timeout-minutes: 2
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-
          
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --prefer-offline
        
      - name: Build application
        run: pnpm run build

  playwright-tests:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        
      - name: Install pnpm
        timeout-minutes: 3
        uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.33.0

      - name: Setup Node.js
        timeout-minutes: 3
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
            
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --prefer-offline

      # Playwright downloads a different browser build per OS release, and
      # ubuntu-latest moves between releases, so the release is in the key.
      - name: Get OS release
        timeout-minutes: 1
        id: os-release
        run: |
          . /etc/os-release
          printf 'release=%s%s\n' "$ID" "$VERSION_ID" >> "$GITHUB_OUTPUT"

      # Restore only browser binaries. Linux system libraries are not cached.
      # The exact lockfile key prevents stale browser versions after updates.
      - name: Cache Playwright browsers
        timeout-minutes: 2
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.os-release.outputs.release }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium and system dependencies
        timeout-minutes: 5
        run: pnpm exec playwright install --with-deps chromium

      # End-to-end tests run against the production build (next start).
      - name: Build application
        timeout-minutes: 10
        run: pnpm run build

      - name: Run Playwright tests
        run: pnpm run test:e2e
        
      - name: Upload Playwright test results
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 30
          if-no-files-found: ignore
