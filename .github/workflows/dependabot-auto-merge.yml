name: Dependabot auto-merge

# Event-driven: runs once per Dependabot PR update and turns on native
# auto-merge. GitHub itself then waits for the required checks on main.
# No checkout: nothing from the PR is executed under pull_request_target.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable native auto-merge (patch/minor, grouped, or github-actions)
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-major'
          || steps.meta.outputs.dependency-group != ''
          || steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Label ungrouped majors for repair/review
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-major'
          && steps.meta.outputs.dependency-group == ''
          && steps.meta.outputs.package-ecosystem != 'github_actions'
        run: |
          gh label create major-update --color D93F0B --description "Major version bump" 2>/dev/null || true
          gh pr edit "$PR_URL" --add-label major-update
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
