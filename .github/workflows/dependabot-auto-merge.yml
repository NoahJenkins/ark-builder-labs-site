name: Dependabot auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

# Enable native auto-merge only. Required checks still have to pass; this
# workflow does not approve the pull request or bypass branch protection.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Dependabot auto-merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Decide whether this update can auto-merge
        id: decide
        env:
          DEPENDABOT_UPDATED_JSON: ${{ steps.meta.outputs.updated-dependencies-json }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDABOT_ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          DEPENDABOT_GROUP: ${{ steps.meta.outputs.dependency-group }}
          DEPENDABOT_ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
          DEPENDABOT_GHSA_ID: ${{ steps.meta.outputs.ghsa-id }}
        run: node .github/scripts/dependabot-auto-merge-decision.mjs

      - name: Enable squash auto-merge
        if: ${{ steps.decide.outputs.action == 'merge' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if gh pr merge --auto --squash "$PR_URL"; then
            echo "Enabled squash auto-merge for $PR_URL"
            exit 0
          fi
          enabled="$(gh pr view "$PR_URL" --json autoMergeRequest --jq 'if .autoMergeRequest then "yes" else "no" end')"
          if [[ "$enabled" == "yes" ]]; then
            echo "Squash auto-merge is already enabled for $PR_URL"
            exit 0
          fi
          echo "Could not enable auto-merge for $PR_URL" >&2
          exit 1

      - name: Label major updates for review
        if: ${{ steps.decide.outputs.action == 'review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          exists="$(gh label list --limit 200 --json name --jq '.[] | select(.name == "needs-review") | .name')"
          if [[ "$exists" != "needs-review" ]]; then
            gh label create needs-review --color B60205 --description "Major dependency update left for human review"
          fi
          gh pr edit "$PR_URL" --add-label needs-review
